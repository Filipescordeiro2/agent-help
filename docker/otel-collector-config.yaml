# OpenTelemetry Collector -- recebe traces OTLP da aplicacao e encaminha ao Tempo.
# Sem segredos. As metricas seguem o caminho Prometheus (scrape de app:8000/metrics).
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]
