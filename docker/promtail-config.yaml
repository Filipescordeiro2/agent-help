# Promtail -- le os logs JSON (structlog, allowlist de campos) do container `app` via socket
# Docker e envia ao Loki. Nao exige plugin de logging Docker no host.
server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker-app
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.service=app"]
    relabel_configs:
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: service
    pipeline_stages:
      - json:
          expressions:
            level: level
            agent: agent
            node: node
            trace_id: trace_id
      - labels:
          level:
          agent:
          node:
