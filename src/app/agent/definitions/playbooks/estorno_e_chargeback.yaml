# Playbook do tipo de solicitacao: Estorno de venda e chargeback.
# Soma-se ao Playbook geral (pb_atendimento_duvidas_n1): aqui ficam as regras do assunto.
# Escolhido pelas Keywords do assunto (ou por similaridade). As etapas com `tool` sao
# executadas pelo pipeline antes da resposta (base primeiro; se nao responde, a web, e o que
# for relevante fica salvo na base para as proximas perguntas).
id: pb_estorno_e_chargeback
name: Estorno de venda e chargeback
objective: >-
  Orientar o cliente a estornar (cancelar) uma venda na maquininha ou pelo aplicativo, e a
  entender o que e chargeback e como tratar uma contestacao.
owning_agent: knowledge_agent
parent: pb_atendimento_duvidas_n1
when_to_use: >-
  Use quando o cliente quiser cancelar/estornar uma venda (na maquininha ou pelo aplicativo) ou
  perguntar sobre chargeback e contestacao de compra.
status: active
symptoms:
  - "estornar venda"
  - "cancelar venda"
  - "devolver dinheiro ao cliente"
  - "venda errada"
  - "chargeback"
  - "contestacao"
  - "compra nao reconhecida"
  - "domicilio bancario do estorno"
prerequisites:
  - Mensagem do cliente recebida (user_id e sessao ja validados pelo canal).
authorized_tools:
  - search_knowledge
  - search_web_pages
skills:
  - skill_estorno_e_chargeback
steps:
  - step_id: entender_duvida
    instruction: >-
      Descubra se e ESTORNO (o lojista cancela uma venda que ele mesmo fez) ou CHARGEBACK (o portador
      do cartao contesta a compra), e onde o cliente quer fazer: na maquininha ou pelo aplicativo.
    on_success: consultar_base
    on_failure: pedir_esclarecimento
  - step_id: pedir_esclarecimento
    instruction: >-
      Faca UMA pergunta objetiva para obter o dado que falta e aguarde a resposta do cliente.
    on_success: consultar_base
    on_failure: escalar
  - step_id: consultar_base
    tool: search_knowledge
    instruction: >-
      Verifique se a base de conhecimento (busca vetorial) ja tem conteudo que responda. Se tiver,
      responda so com a base e NAO acesse a web.
    on_success: responder
    on_failure: consultar_web
  - step_id: consultar_web
    tool: search_web_pages
    instruction: >-
      A base nao responde: consulte as fontes web do assunto e salve na base so os trechos relevantes.
      Costumam responder as paginas 'Como estornar uma venda na maquininha', 'Como estornar uma venda
      pelo aplicativo' e 'Chargeback' da Central de Ajuda.
    on_success: responder
    on_failure: escalar
  - step_id: responder
    instruction: >-
      Apresente o passo a passo na ordem da fonte (numerado) e deixe claras as condicoes: mesmo
      cartao, valor exato da venda, prazo para estornar. Diferencie estorno de chargeback.
    on_success: confirmar_resolucao
    on_failure: escalar
  - step_id: confirmar_resolucao
    instruction: >-
      Pergunte se a duvida foi resolvida. Se nao, reformule a explicacao uma vez e, persistindo,
      escale.
    on_success: closed
    on_failure: escalar
  - step_id: escalar
    instruction: >-
      Diga com transparencia o que nao foi encontrado e oriente o cliente a procurar a central de
      atendimento da Getnet. Nao use siglas internas na conversa.
    on_success: closed
    on_failure: closed
decision_points:
  - question: A base de conhecimento responde a duvida deste assunto?
    if_yes: responder so com a base (nao acessar a web)
    if_no: consultar as fontes web do assunto e salvar so o relevante na base
  - question: Falta algum dado do cliente para responder com precisao?
    if_yes: fazer UMA pergunta objetiva
    if_no: responder com o que a fonte traz
exceptions:
  - "Nunca peca o numero completo do cartao nem a senha do lojista ao cliente."
  - "Se citar a senha padrao publicada na fonte oficial, diga que e a padrao e recomende altera-la."
escalation_rules:
  - "O estorno nao e mais possivel pelos canais descritos (fora do prazo) ou o cliente relata cobranca indevida ja efetivada."
success_criteria:
  - "O cliente sabe qual caminho seguir (maquininha ou app) e as condicoes do estorno."
closure_criteria:
  - O cliente confirmou que a duvida foi resolvida ou foi orientado a procurar a central de atendimento.
