# Keywords do dominio Getnet: termos, sinonimos e associacoes com intencoes, Skills e Playbooks.
# O agente procura o termo e os sinonimos na mensagem do cliente; cada Keyword aponta para o
# Playbook do assunto e para as Skills que ajudam (peso maior = escolhida primeiro).
# Cada `term` deve ser unico (normalizado em minusculas). Os ids em `associated_*` precisam existir
# nos arquivos de skills/playbooks.
