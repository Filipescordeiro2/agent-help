      Use para duvidas sobre Get Smart, modo quiosque, totem de autoatendimento e automacoes.
    topics: [get smart, modo quiosque, autoatendimento, totem, automacao, aplicativo configurar, terminal]
    priority: 42
    enabled: true

  - id: ws_ajuda_manual_maquininha
    name: Get Ajuda - Como acessar o manual da maquininha
    url: https://site.getnet.com.br/get-ajuda-maquininha/como-acessa-o-manual-da-sua-maquininha-getnet/
    description: >-
      Todos os manuais das maquininhas Getnet sao digitais. Indica onde acessar o manual do modelo (lista
      de manuais navegaveis em site.getnet.com.br/boas-vindas/manual-maquinas/) e pela pagina do Get
      Ajuda.
    usage: >-
      Use quando o cliente pedir manual, guia de uso ou instrucoes de um modelo de maquininha.
    topics: [manual, manual da maquininha, guia, instrucoes, modelo, como usar, pdf]
    priority: 42
    enabled: true

  - id: ws_ajuda_manutencao_maquininha
    name: Get Ajuda - Como solicitar a manutencao da maquininha
    url: https://site.getnet.com.br/get-ajuda-maquininha/como-solicitar-a-manutencao-da-maquininha-getnet/
    description: >-
      Como solicitar manutencao da maquininha pelo Aplicativo Getnet Brasil (opcao Manutencao de maquina
