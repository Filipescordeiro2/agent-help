# Central de Ajuda Getnet - uso, compra, manual, erros e manutencao da maquininha.
sources:
  - id: ws_ajuda_vender_na_maquininha
    name: Get Ajuda - Como fazer uma venda na maquininha
    url: https://site.getnet.com.br/get-ajuda-maquininha/como-fazer-uma-venda-na-maquininha-getnet/
    description: >-
      Passo a passo para realizar uma venda na maquininha Getnet: ligar a maquininha, inserir o valor,
      escolher a forma de pagamento (debito, credito, voucher ou Pix) e concluir a venda.
    usage: >-
      Use quando o cliente perguntar como cobrar ou passar uma venda na maquininha, formas de pagamento
      e comprovante.
    topics: [vender, venda, cobrar, passar cartao, debito, credito, parcelado, voucher, comprovante, como usar a maquininha]
    priority: 42
    enabled: true

  - id: ws_ajuda_erros_maquininha
    name: Get Ajuda - Erros na maquininha
    url: https://site.getnet.com.br/get-ajuda-erros-maquininha/
    description: >-
      Pagina de suporte sobre erros da maquininha, com videos de dicas e informacoes, link para o
      Aplicativo Getnet Brasil e para os manuais dos modelos. Traz pouco texto, pois o conteudo
      principal e em video.
    usage: >-
      Use quando o cliente relatar erro, travamento, falha ou mensagem de erro na maquininha; combine
      com o manual e com a manutencao.
    topics: [erro, erros, maquininha com erro, falha, travou, nao liga, mensagem de erro, problema, suporte tecnico]
    priority: 42
    enabled: true

  - id: ws_ajuda_maquininha_adicional
    name: Get Ajuda - Como pedir uma maquininha adicional
    url: https://site.getnet.com.br/get-ajuda-maquininha/como-pedir-uma-maquininha-adicional/
    description: >-
      Como pedir maquininhas adicionais pelo Portal (menu Financeiro ou Produtos e servicos). Ativacao e
