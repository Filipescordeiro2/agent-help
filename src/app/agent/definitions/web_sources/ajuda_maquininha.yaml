    enabled: true

  - id: ws_ajuda_produtos_e_servicos
    name: Get Ajuda - Adquirindo nossos produtos e servicos (escolha sua maquininha)
    url: https://site.getnet.com.br/get-ajuda-maquininha/adquirindo-nossos-produtos-e-servicos/
    description: >-
      Pagina comercial para escolher e adquirir a maquininha: taxas exclusivas para o CNPJ, aceite de
      cartoes em moedas estrangeiras, recebimento por Pix, conta e cartao gratis, recebimento em 2 dias
      uteis, frete gratis e comparativo de maquininhas.
    usage: >-
      Use para clientes que querem comprar ou contratar uma maquininha, conhecer modelos e condicoes
      comerciais e receber em 2 dias uteis.
    topics: [comprar maquininha, contratar, adquirir, modelos, escolher maquininha, conta gratis, cartao gratis, frete gratis, recebimento em 2 dias, moedas estrangeiras, get conta, oferta]
    priority: 42
    enabled: true

  - id: ws_ajuda_get_smart
    name: Get Ajuda - Solucoes Get Smart
    url: https://site.getnet.com.br/get-ajuda-maquininha/solucoes-get-smart/
    description: >-
      Explica a Get Smart: modo quiosque (autoatendimento com apenas um aplicativo aberto,
