    usage: >-
      Use para maquininha com defeito, reparo, troca, manutencao e suporte tecnico do equipamento.
    topics: [manutencao, defeito, quebrou, reparo, troca de maquininha, maquininha com problema, assistencia tecnica, suporte, chamado, aplicativo]
