# Central de Ajuda Getnet - cadastro, acesso ao aplicativo e domicilio bancario.
sources:
  - id: ws_ajuda_domicilio_bancario
    name: Get Ajuda - Como trocar o domicilio bancario
    url: https://site.getnet.com.br/get-ajuda-cadastro/como-trocar-o-domicilio-bancario/
    description: >-
      Como conferir e trocar o domicilio bancario (a conta que recebe as vendas) pelo Aplicativo Getnet
      Brasil e pelo Portal, mantendo os dados bancarios atualizados para a liquidacao no prazo.
    usage: >-
      Use para mudar a conta bancaria de recebimento, atualizar dados bancarios e receber em outra conta.
    topics: [domicilio bancario, conta bancaria, dados bancarios, trocar conta, banco, agencia, receber em outra conta, liquidacao]
    priority: 45
    enabled: true

  - id: ws_ajuda_atualizar_cadastro
